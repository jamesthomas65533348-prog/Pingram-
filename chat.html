<!DOCTYPE html>
<html lang="en">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PINGRAM - Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--purple:#7C3AED;--blue:#3B82F6;--grad:linear-gradient(135deg,#7C3AED 0%,#3B82F6 100%);--glass:rgba(255,255,255,0.82);--border:rgba(255,255,255,0.8)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent!important;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important}
input,textarea{-webkit-user-select:text!important;user-select:text!important}
body{height:100dvh;display:flex;justify-content:center;background: url('background.png') no-repeat center center fixed; background-size: cover; overflow:hidden}
.app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;position:relative;background: url('background.png') no-repeat center center; background-size: cover; animation:fadeIn .35s ease}
.app::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.18);backdrop-filter:blur(0px);z-index:0;pointer-events:none}
.app > *{position:relative;z-index:1}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* HEADER - 3 ISLANDS */
.top{padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.88);backdrop-filter:blur(30px) saturate(200%);border-bottom:1px solid rgba(124,58,237,.08);z-index:20}
.island{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.06);border-radius:999px;display:flex;align-items:center}
.island.left{width:42px;height:42px;justify-content:center;cursor:pointer}
.island.center{flex:1;padding:8px 14px;flex-direction:column;align-items:center;min-width:0;cursor:pointer}
.island.right{width:46px;height:46px;justify-content:center;position:relative;cursor:pointer;overflow:visible;padding:2px}
.island.right #otherAvatar{width:100%;height:100%;border-radius:999px;overflow:hidden;display:block}
.island.right img{width:100%;height:100%;border-radius:999px;object-fit:cover}
.center-name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.center-status{font-size:11px;font-weight:600;color:#8B8BA3;margin-top:1px}
.avatar-initials{width:40px;height:40px;border-radius:999px;background:var(--grad);display:grid;place-items:center;color:white;font-weight:800;font-size:14px}
.avatar-initials.xxl{width:110px;height:110px;font-size:38px;border:4px solid white}
.online-dot{position:absolute;bottom:-1px;right:-1px;width:13px;height:13px;border-radius:999px;border:2.5px solid white;z-index:2}
.online-dot.on{background:#10B981}.online-dot.off{background:#9CA3AF}

/* MESSAGES */
.messages{flex:1;overflow-y:auto;padding:16px 12px 12px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;background:transparent;}
.date-sep{text-align:center;margin:14px 0 8px;font-size:11px;font-weight:700;color:#8B8BA3;background:rgba(244,242,255,.8);padding:6px 12px;border-radius:999px;align-self:center;backdrop-filter:blur(10px)}
.msg-row{display:flex;gap:8px;margin:2px 0;max-width:82%;position:relative}
.msg-row.me{align-self:flex-end;flex-direction:row-reverse}
.msg-row.other{align-self:flex-start}
.bubble{padding:10px 12px;border-radius:18px;position:relative;word-break:break-word;white-space:pre-wrap;line-height:1.35;font-size:14px;transition:.2s}
.me .bubble{background:var(--grad);color:white;border-bottom-right-radius:6px;box-shadow:0 4px 16px rgba(124,58,237,.18)}
.other .bubble{background:rgba(255,255,255,0.92);border:1px solid rgba(255,255,255,0.9);box-shadow:0 2px 12px rgba(0,0,0,.06);border-bottom-left-radius:6px}
.bubble img.msg-img{max-width:200px;max-height:260px;border-radius:12px;display:block;margin:2px 0;cursor:pointer;object-fit:cover}
.reply-preview{background:rgba(0,0,0,.08);border-left:3px solid var(--purple);padding:6px 8px;border-radius:8px;margin-bottom:6px;font-size:12px;cursor:pointer}
.me .reply-preview{background:rgba(255,255,255,.18);border-left-color:white}
.meta{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:10px;opacity:.8;justify-content:flex-end}
.meta .edited{font-style:italic}
.tick{display:inline-flex}
.highlight{animation:hl 1.2s ease}
@keyframes hl{0%{background:rgba(124,58,237,.25)}100%{background:transparent}}

/* COMPOSER */
.composer-wrap{padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,0.88);backdrop-filter:blur(30px) saturate(200%);border-top:1px solid rgba(124,58,237,.08);z-index:15}
.composer{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border);border-radius:24px;padding:6px 6px 6px 10px;display:flex;align-items:flex-end;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.composer textarea{flex:1;border:none;background:transparent;outline:none;resize:none;max-height:110px;min-height:22px;font-size:14px;padding:8px 4px;line-height:1.4}
.icon-mini{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:.2s}
.icon-mini:active{transform:scale(.92)}
.send-btn{width:38px;height:38px;border-radius:999px;background:var(--grad);color:white;display:none;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(124,58,237,.3)}
.send-btn.show{display:grid}
.reply-bar{display:none;background:rgba(244,242,255,.9);border-left:3px solid var(--purple);padding:8px 10px;border-radius:12px;margin-bottom:8px;align-items:center;justify-content:space-between}
.reply-bar.show{display:flex}

/* POPUPS */
.popup{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);pointer-events:none;opacity:0;transition:opacity.35s ease}
.popup.show{pointer-events:auto;opacity:1;background:rgba(15,10,40,.32);backdrop-filter:blur(22px) saturate(180%)}
.sheet{width:100%;max-width:480px;background:rgba(255,255,255,0.98);backdrop-filter:blur(50px) saturate(200%);border-radius:32px 32px 0 0;padding:14px 16px 30px;transform:translateY(100%);transition:transform.55s cubic-bezier(0.32,0.72,0,1);box-shadow:0 -12px 40px rgba(0,0,0,.12)}
.popup.show .sheet{transform:translateY(0)}
.sheet button{width:100%;padding:16px;border:none;background:rgba(244,242,255,.8);border-radius:14px;margin-bottom:8px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.sheet button.danger{color:#EF4444;background:rgba(239,68,68,.08)}
.handle{width:36px;height:4px;background:rgba(0,0,0,.15);border-radius:999px;margin:0 auto 16px}
.profile-modal{position:fixed;inset:0;z-index:90;background:white;display:none;flex-direction:column}
.profile-modal.show{display:flex;animation:fadeIn .3s ease}
.cover{height:420px;background:var(--grad);position:relative;overflow:hidden;display:grid;place-items:center}
.cover img.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover .overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 100%);z-index:1}
.cover .top-actions{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;z-index:5;padding:12px;padding-top:calc(12px + env(safe-area-inset-top))}
.icon-btn{width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.8);box-shadow:0 8px 24px rgba(0,0,0,.15);display:grid;place-items:center;cursor:pointer}
.island-btn{background:rgba(255,255,255,0.9);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,0.8);box-shadow:0 8px 24px rgba(0,0,0,.12);border-radius:999px;}
.img-viewer{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.92);display:none;place-items:center;padding:20px}
.img-viewer.show{display:grid}
.img-viewer img{max-width:100%;max-height:85vh;border-radius:16px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-150%);z-index:999;background:rgba(255,255,255,0.94);backdrop-filter:blur(20px);padding:10px 14px;border-radius:999px;font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.12);transition:.5s cubic-bezier(0.32,0.72,0,1);pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
.empty{flex:1;display:grid;place-items:center;padding:40px 24px;text-align:center;color:#8B8BA3}
</style>
</head>
<body>
<div id="toast"></div>
<audio id="sendSound" src="send.mp3" preload="auto"></audio>
<audio id="receiveSound" src="receive.mp3" preload="auto"></audio>
<div class="app" id="app">
  <div class="top">
    <div class="island left" id="backBtn"><span class="material-icons-round">arrow_back</span></div>
    <div class="island center" id="centerIsland"><div class="center-name" id="otherName">Loading...</div><div class="center-status" id="otherStatus">...</div></div>
    <div class="island right" id="otherAvatarWrap"><div id="otherAvatar"></div><div class="online-dot off" id="onlineDot"></div></div>
  </div>

  <div class="messages" id="messages"><div class="empty"><div><div style="width:70px;height:70px;background:rgba(124,58,237,.08);border-radius:20px;display:inline-grid;place-items:center;margin-bottom:12px"><span class="material-icons-round" style="color:#7C3AED;font-size:32px">forum</span></div><h3 style="font-weight:800;color:#111">No messages yet</h3><p style="font-size:13px;margin-top:6px">Say hello and start chatting</p></div></div></div>

  <div class="composer-wrap">
    <div class="reply-bar" id="replyBar"><div style="flex:1;min-width:0"><div id="replyName" style="font-weight:700;font-size:12px;color:var(--purple)"></div><div id="replyText" style="font-size:12px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div><span class="material-icons-round" id="closeReply" style="cursor:pointer">close</span></div>
    <div id="editBar" class="reply-bar" style="border-left-color:#F59E0B"><div style="flex:1"><div style="font-weight:700;font-size:12px;color:#F59E0B">Editing</div><div id="editText" style="font-size:12px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div><span class="material-icons-round" id="closeEdit" style="cursor:pointer">close</span></div>
    <div class="composer">
      <div class="icon-mini" id="imgBtn"><span class="material-icons-round">image</span></div>
      <textarea id="msgInput" placeholder="Message" rows="1"></textarea>
      <div class="icon-mini" id="emojiBtn"><span class="material-icons-round">mood</span></div>
      <div class="send-btn" id="sendBtn"><span class="material-icons-round">send</span></div>
    </div>
    <div id="imgPreview" style="display:none;margin-top:8px;position:relative;width:90px"><img id="previewImg" style="width:90px;height:90px;border-radius:12px;object-fit:cover"><span class="material-icons-round" id="removePreview" style="position:absolute;top:-6px;right:-6px;background:white;border-radius:999px;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)">close</span></div>
  </div>
</div>

<!-- Profile Modal -->
<div class="profile-modal" id="profileModal">
    <div class="cover" id="profileCover">
    <img id="coverFullImg" class="full" style="display:none">
    <div id="coverInitials" style="z-index:2"></div>
    <div class="overlay"></div>
    <div class="top-actions">
      <button class="icon-btn island-btn" onclick="closeProfile()"><span class="material-icons-round">arrow_back</span></button>
      <div></div>
    </div>
    <button class="icon-btn island-btn" id="downloadPicBtn" style="display:none;position:absolute;bottom:16px;right:16px;z-index:5"><span class="material-icons-round">download</span></button>
  </div>
  <div style="padding:20px">
    <h2 id="profName" style="font-size:22px;font-weight:800"></h2>
    <p id="profUsername" style="color:var(--purple);font-weight:600;margin-top:4px"></p>
    <p id="profBio" style="color:#6B7280;margin-top:12px;font-size:14px"></p>
    <p id="profStatus" style="margin-top:12px;font-size:12px;font-weight:600"></p>
    <button id="blockBtn" style="width:100%;padding:14px;background:rgba(239,68,68,.08);border:none;border-radius:999px;color:#EF4444;font-weight:700;margin-top:16px">Block User</button>
  </div>
</div>

<!-- Message Actions -->
<div class="popup" id="msgSheet"><div class="sheet"><div class="handle"></div>
  <button id="actReply"><span class="material-icons-round">reply</span>Reply</button>
  <button id="actCopy"><span class="material-icons-round">content_copy</span>Copy</button>
  <button id="actShare"><span class="material-icons-round">share</span>Share</button>
  <button id="actEdit" style="display:none"><span class="material-icons-round">edit</span>Edit</button>
  <button id="actDelete" class="danger" style="display:none"><span class="material-icons-round">delete</span>Delete</button>
  <button onclick="closePop('msgSheet')" style="justify-content:center;background:white;border:1px solid #E5E7EB">Cancel</button>
</div></div>

<div class="popup" id="downloadSheet"><div class="sheet" style="text-align:center"><div class="handle"></div>
  <div style="width:64px;height:64px;background:var(--grad);border-radius:20px;display:inline-grid;place-items:center;margin-bottom:12px"><span class="material-icons-round" style="color:white;font-size:28px">download</span></div>
  <h3 style="font-size:18px;font-weight:800">Save Photo?</h3>
  <p style="font-size:13px;color:#6B7280;margin-top:6px">Save <span id="dlName"></span>'s photo?</p>
  <div style="display:flex;gap:10px;margin-top:18px"><button onclick="closePop('downloadSheet')" style="flex:1;padding:14px;background:rgba(244,242,255,.8);border:none;border-radius:12px;font-weight:600">Cancel</button><button id="confirmDownload" style="flex:1;padding:14px;background:var(--grad);color:white;border:none;border-radius:12px;font-weight:700">Save</button></div>
</div></div>

<div class="img-viewer" id="imgViewer"><img id="viewerImg"><div style="position:absolute;top:16px;right:16px;display:flex;gap:10px"><button class="icon-btn" id="downloadViewer"><span class="material-icons-round">download</span></button><button class="icon-btn" onclick="$('imgViewer').classList.remove('show')"><span class="material-icons-round">close</span></button></div></div>
<div class="popup" id="blockSheet"><div class="sheet" style="text-align:center"><div class="handle"></div>
<div style="width:72px;height:72px;background:linear-gradient(135deg,#FEE2E2,#FECACA);border-radius:20px;display:inline-grid;place-items:center;margin-bottom:14px"><span class="material-icons-round" style="color:#EF4444;font-size:32px">block</span></div>
<h3 style="font-size:19px;font-weight:800">Block <span id="blockName"></span>?</h3>
<p style="font-size:13px;color:#6B7280;margin-top:8px">Chats will be deleted to save storage.</p>
<div style="display:flex;gap:10px;margin-top:20px"><button onclick="closePop('blockSheet')" style="flex:1;padding:14px;background:rgba(244,242,255,.9);border:none;border-radius:14px;font-weight:600;justify-content:center">Cancel</button><button id="confirmBlock" style="flex:1;padding:14px;background:#EF4444;color:white;border:none;border-radius:14px;font-weight:700;justify-content:center">Block</button></div>
</div></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
const supa = supabase.createClient(PINGR_CONFIG.SUPABASE_URL, PINGR_CONFIG.SUPABASE_ANON_KEY);
const $ = id=>document.getElementById(id);
let myUser=null, otherUser=null, conversationId=null, replyTo=null, editMsg=null, selectedMsg=null;
let pendingImageFile=null, pendingImageUrl=null;
let messagesCache=[];

function toast(m){ $('toast').textContent=m; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'),2200); }
function closePop(id){ $(id).classList.remove('show'); }
function openPop(id){ $(id).classList.add('show'); }
function getInitials(fn,ln){ return ((fn||'')[0]||''+(ln||'')[0]||'').toUpperCase()||'P'; }
function avatarHTML(user,size=''){ if(user?.profile_photo_url) return `<img src="${user.profile_photo_url}" style="width:100%;height:100%;border-radius:999px;object-fit:cover">`; return `<div class="avatar-initials ${size}">${getInitials(user?.first_name,user?.last_name)}</div>`; }
function isReallyOnline(u){ if(!u?.is_online) return false; return (Date.now() - new Date(u.last_seen).getTime()) < 3*60*1000; }
function formatTime(d){ return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function formatLastSeen(d){ const date=new Date(d); return `Last seen ${date.toLocaleDateString()} at ${date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`; }
function dateLabel(d){ const date=new Date(d); const now=new Date(); const diff=Math.floor((now-date)/86400000); if(diff===0) return 'Today'; if(diff===1) return 'Yesterday'; return date.toLocaleDateString(undefined,{weekday:'long'}); }

function closeProfile(){ $('profileModal').classList.remove('show'); }
function playSend(){ try{ const a=$('sendSound'); a.currentTime=0; a.play().catch(()=>{});}catch(e){} }
function playReceive(){ try{ const a=$('receiveSound'); a.currentTime=0; a.play().catch(()=>{});}catch(e){} }

async function init(){
  const token=localStorage.getItem('pingr_session_token'); const uid=localStorage.getItem('pingr_user_id');
  if(!token||!uid){ location.href='login.html'; return; }
  const params=new URLSearchParams(location.search); conversationId=params.get('conversation_id'); if(!conversationId){ location.href='home.html'; return; }
  const {data:me}=await supa.from('pingr_users').select('*').eq('id',uid).single(); myUser=me;
  const {data:conv}=await supa.from('pingr_conversations').select('*').eq('id',conversationId).single(); if(!conv){ toast('Chat not found'); return; }
  const otherId = conv.user1_id===uid? conv.user2_id : conv.user1_id;
  const {data:other}=await supa.from('pingr_users').select('*').eq('id',otherId).single(); otherUser=other;

  $('otherName').textContent = other.first_name+' '+other.last_name;
  $('otherAvatar').innerHTML = avatarHTML(other);
  updateOnlineUI();

  await loadMessages();
  subscribe();
  setInterval(updateOnlineUI,30000);
}

function updateOnlineUI(){
  if(!otherUser) return;
  const online=isReallyOnline(otherUser);
  $('onlineDot').className='online-dot '+(online?'on':'off');
  $('otherStatus').textContent=online?'Online':formatLastSeen(otherUser.last_seen);
  $('otherStatus').style.color=online?'#10B981':'#8B8BA3';
}

async function loadMessages(){
  const {data}=await supa.from('pingr_messages').select('*, reply:reply_to_id(id,content,sender_id)').eq('conversation_id',conversationId).eq('is_deleted',false).order('created_at',{ascending:true}).limit(200);
  messagesCache=data||[];
  renderMessages();
  markRead();
}

function renderMessages(){
  const box=$('messages'); box.innerHTML=''; let lastDate='';
  messagesCache.forEach(m=>{
    const dLabel=dateLabel(m.created_at);
    if(dLabel!==lastDate){ const sep=document.createElement('div'); sep.className='date-sep'; sep.textContent=dLabel; box.appendChild(sep); lastDate=dLabel; }
    const isMe=m.sender_id===myUser.id;
    const row=document.createElement('div'); row.className='msg-row '+(isMe?'me':'other'); row.dataset.id=m.id;
    let replyHtml=''; if(m.reply_to_id){ const rep=messagesCache.find(x=>x.id===m.reply_to_id); if(rep){ replyHtml=`<div class="reply-preview" onclick="scrollToMsg('${rep.id}')"><b>${rep.sender_id===myUser.id?'You':otherUser.first_name}</b><br>${(rep.content||'📷 Image').slice(0,60)}</div>`; } }
    let imgHtml=''; if(m.image_url) imgHtml=`<img src="${m.image_url}" class="msg-img" onclick="openViewer('${m.image_url}')">`;
    let contentHtml=m.content? `<div>${escapeHtml(m.content)}</div>` : '';
    let editedHtml=m.is_edited? `<span class="edited">Edited</span>` : '';
    let ticks=''; if(isMe){ if(m.is_read) ticks='<span class="material-icons-round" style="font-size:14px">done_all</span>'; else ticks='<span class="material-icons-round" style="font-size:14px">done</span>'; }
    row.innerHTML=`<div class="bubble">${replyHtml}${imgHtml}${contentHtml}<div class="meta"><span>${formatTime(m.created_at)}</span> ${editedHtml} <span class="tick">${ticks}</span></div></div>`;
    row.addEventListener('touchstart', e=>{ row._timer=setTimeout(()=>openMsgActions(m),500); });
    row.addEventListener('touchend', ()=>clearTimeout(row._timer));
    row.addEventListener('contextmenu', e=>{ e.preventDefault(); openMsgActions(m); });
    box.appendChild(row);
  });
  box.scrollTop=box.scrollHeight;
}

function escapeHtml(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function scrollToMsg(id){ const el=document.querySelector(`[data-id="${id}"]`); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('highlight'); setTimeout(()=>el.classList.remove('highlight'),1200); } }

let actionTarget=null;
function openMsgActions(m){ actionTarget=m; selectedMsg=m; const isMe=m.sender_id===myUser.id; $('actEdit').style.display=isMe?'flex':'none'; $('actDelete').style.display=isMe?'flex':'none'; openPop('msgSheet'); }

$('actReply').onclick=()=>{ if(!selectedMsg) return; replyTo=selectedMsg; $('replyName').textContent=selectedMsg.sender_id===myUser.id?'You':otherUser.first_name; $('replyText').textContent=(selectedMsg.content||'📷 Image').slice(0,80); $('replyBar').classList.add('show'); closePop('msgSheet'); $('msgInput').focus(); };
$('actCopy').onclick=()=>{ if(selectedMsg?.content){ navigator.clipboard.writeText(selectedMsg.content); toast('Copied'); } closePop('msgSheet'); };
$('actShare').onclick=()=>{ if(selectedMsg?.content && navigator.share){ navigator.share({text:selectedMsg.content}); } else if(selectedMsg?.content){ navigator.clipboard.writeText(selectedMsg.content); toast('Copied for sharing'); } closePop('msgSheet'); };
$('actEdit').onclick=()=>{ if(!selectedMsg) return; editMsg=selectedMsg; $('editText').textContent=(selectedMsg.content||'').slice(0,80); $('editBar').classList.add('show'); $('msgInput').value=selectedMsg.content; $('msgInput').focus(); checkSend(); closePop('msgSheet'); };
$('actDelete').onclick=()=>{
  if(!selectedMsg) return;
  const id=selectedMsg.id;
  const row=document.querySelector(`[data-id="${id}"]`);
  if(row) row.style.opacity='0';
  messagesCache=messagesCache.filter(x=>x.id!==id);
  if(row) setTimeout(()=>row.remove(),150);
  closePop('msgSheet');
  supa.from('pingr_messages').update({is_deleted:true}).eq('id',id).then(()=>{});
};
$('closeReply').onclick=()=>{ replyTo=null; $('replyBar').classList.remove('show'); };
$('closeEdit').onclick=()=>{ editMsg=null; $('editBar').classList.remove('show'); $('msgInput').value=''; checkSend(); };

$('imgBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{ const f=e.target.files[0]; if(!f) return; pendingImageFile=f; const url=URL.createObjectURL(f); $('previewImg').src=url; $('imgPreview').style.display='block'; pendingImageUrl=url; checkSend(); };
$('removePreview').onclick=()=>{ pendingImageFile=null; $('imgPreview').style.display='none'; checkSend(); };

function checkSend(){ const hasText=$('msgInput').value.trim()!==''; const hasImg=!!pendingImageFile; if(hasText||hasImg) $('sendBtn').classList.add('show'); else $('sendBtn').classList.remove('show'); }
$('msgInput').addEventListener('input',()=>{ $('msgInput').style.height='auto'; $('msgInput').style.height=$('msgInput').scrollHeight+'px'; checkSend(); });

$('sendBtn').onclick=sendMessage;
$('msgInput').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } });

async function sendMessage(){
  const text=$('msgInput').value.trim();
  if(!text && !pendingImageFile) return;
    $('sendBtn').innerHTML='<span class="material-icons-round" style="font-size:16px">hourglass_top</span>';
  playSend();

  let imageUrl='';
  if(pendingImageFile){
    const name=`${conversationId}/${Date.now()}_${pendingImageFile.name}`;
    const {error}=await supa.storage.from('pingr_messages').upload(name, pendingImageFile);
    if(error){ toast('Image upload failed'); $('sendBtn').innerHTML='<span class="material-icons-round">send</span>'; return; }
    const {data}=supa.storage.from('pingr_messages').getPublicUrl(name); imageUrl=data.publicUrl;
  }

  if(editMsg){
    await supa.from('pingr_messages').update({content:text, is_edited:true}).eq('id',editMsg.id);
    editMsg=null; $('editBar').classList.remove('show');
  } else {
    await supa.from('pingr_messages').insert({conversation_id:conversationId, sender_id:myUser.id, content:text, image_url:imageUrl, reply_to_id:replyTo?.id||null});
    replyTo=null; $('replyBar').classList.remove('show');
  }

  $('msgInput').value=''; $('msgInput').style.height='auto'; pendingImageFile=null; $('imgPreview').style.display='none'; checkSend();
  $('sendBtn').innerHTML='<span class="material-icons-round">send</span>';
}

function subscribe(){
  supa.channel('chat-'+conversationId)
  .on('postgres_changes',{event:'*',schema:'public',table:'pingr_messages',filter:`conversation_id=eq.${conversationId}`}, async payload=>{
        if(payload.eventType==='INSERT'){ const {data}=await supa.from('pingr_messages').select('*, reply:reply_to_id(id,content,sender_id)').eq('id',payload.new.id).single(); if(!messagesCache.find(x=>x.id===data.id)){ if(data.sender_id!==myUser.id) playReceive(); messagesCache.push(data); renderMessages(); if(data.sender_id!==myUser.id) markRead(); } }
    if(payload.eventType==='UPDATE'){ const idx=messagesCache.findIndex(m=>m.id===payload.new.id); if(idx>-1){ Object.assign(messagesCache[idx],payload.new); renderMessages(); } }
    if(payload.eventType==='DELETE'){ messagesCache=messagesCache.filter(m=>m.id!==payload.old.id); renderMessages(); }
  })
  .on('postgres_changes',{event:'*',schema:'public',table:'pingr_users',filter:`id=eq.${otherUser.id}`}, payload=>{
    otherUser=payload.new; updateOnlineUI();
  })
  .subscribe();
}

async function markRead(){
  await supa.from('pingr_messages').update({is_read:true}).eq('conversation_id',conversationId).neq('sender_id',myUser.id).eq('is_read',false);
}

$('backBtn').onclick=()=>{ history.back(); setTimeout(()=>{ if(location.pathname.includes('chat.html')) location.href='home.html'; },300); };
$('centerIsland').onclick=openProfile;
$('otherAvatarWrap').onclick=openProfile;

function openProfile(){
  const coverImg=$('coverFullImg'); const initials=$('coverInitials');
  if(otherUser.profile_photo_url){
    coverImg.src=otherUser.profile_photo_url; coverImg.style.display='block'; initials.innerHTML=''; $('downloadPicBtn').style.display='grid';
    coverImg.onclick=()=>openViewer(otherUser.profile_photo_url);
  } else {
    coverImg.style.display='none'; initials.innerHTML=`<div class="avatar-initials xxl">${getInitials(otherUser.first_name,otherUser.last_name)}</div>`; $('downloadPicBtn').style.display='none';
    coverImg.onclick=null;
  }
  $('profName').textContent=otherUser.first_name+' '+otherUser.last_name;
  $('profUsername').textContent=otherUser.hide_username?'Username hidden':'@'+otherUser.username;
  $('profBio').textContent=otherUser.bio||'No bio';
  const online=isReallyOnline(otherUser); $('profStatus').textContent=online?'● Online':formatLastSeen(otherUser.last_seen); $('profStatus').style.color=online?'#10B981':'#8B8BA3';
  $('profileModal').classList.add('show');
}
function closeProfile(){ $('profileModal').classList.remove('show'); }
$('downloadPicBtn').onclick=()=>{ $('dlName').textContent=otherUser.first_name; openPop('downloadSheet'); };
$('confirmDownload').onclick=async()=>{ closePop('downloadSheet'); try{ const res=await fetch(otherUser.profile_photo_url); const blob=await res.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=otherUser.first_name+'.jpg'; a.click(); toast('Saved'); }catch(e){ window.open(otherUser.profile_photo_url,'_blank'); } };

function openViewer(url){ $('viewerImg').src=url; $('imgViewer').classList.add('show'); }
$('downloadViewer').onclick=()=>{ const url=$('viewerImg').src; const a=document.createElement('a'); a.href=url; a.download='pingram.jpg'; a.target='_blank'; a.click(); };
$('confirmBlock').onclick=async()=>{ closePop('blockSheet'); closeProfile(); await supa.rpc('block_pingr_user',{blocker:myUser.id, blocked:otherUser.id}); location.href='home.html'; };
document.getElementById('msgSheet').addEventListener('click', e=>{ if(e.target.id==='msgSheet') closePop('msgSheet'); });
document.getElementById('downloadSheet').addEventListener('click', e=>{ if(e.target.id==='downloadSheet') closePop('downloadSheet'); });
document.getElementById('blockSheet').addEventListener('click', e=>{ if(e.target.id==='blockSheet') closePop('blockSheet'); });
$('blockBtn').onclick=()=>{ $('blockName').textContent=otherUser.first_name; openPop('blockSheet'); };

init();
</script>
</body>
</html>
