<style>
:root{--purple:#7C3AED;--blue:#3B82F6;--grad:linear-gradient(135deg,#7C3AED 0%,#3B82F6 100%)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent!important;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important}
input,textarea{-webkit-user-select:text!important;user-select:text!important}
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;justify-content:center;background: radial-gradient(120% 120% at 0% 0%, #C4B5FD 0%, transparent 50%), radial-gradient(100% 100% at 100% 0%, #93C5FD 0%, transparent 50%), linear-gradient(180deg, #F8F7FF 0%, #FFFFFF 100%), url('/pingram-wallpaper.png');background-size:cover;background-attachment:fixed}
.app{position:fixed;inset:0;width:100%;max-width:480px;margin:0 auto;height:100%;height:100dvh;height:-webkit-fill-available;display:flex;flex-direction:column;overflow:hidden;background: linear-gradient(180deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.94) 100%), url('/pingram-wallpaper.png');background-size:cover;background-position:center;background-blend-mode:overlay}
.top{flex-shrink:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.72);backdrop-filter:blur(36px) saturate(220%);border-bottom:1px solid rgba(124,58,237,.08);z-index:20}
.island{background:rgba(255,255,255,0.58);backdrop-filter:blur(32px) saturate(220%);-webkit-backdrop-filter:blur(32px) saturate(220%);border:1px solid rgba(255,255,255,0.75);box-shadow:0 8px 32px rgba(0,0,0,.08), 0 0 0 1px rgba(255,255,255,.6) inset;border-radius:999px;display:flex;align-items:center}
.island.left{width:42px;height:42px;justify-content:center;cursor:pointer;flex-shrink:0}
.island.center{flex:1;padding:6px 14px;flex-direction:column;align-items:center;min-width:0;position:relative;overflow:hidden;height:44px;justify-content:center}
.center-states{position:relative;width:100%;height:100%;display:grid;place-items:center}
.center-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .55s cubic-bezier(0.32,0.72,0,1), opacity .4s ease;gap:1px}
.center-state.brand{transform:translateY(0);opacity:1}

.center-state.loading{transform:translateY(-120%);opacity:0}
.app.no-internet .center-state.brand{transform:translateY(120%);opacity:0}
.app.no-internet .center-state.loading{transform:translateY(120%);opacity:0}
.app.no-internet .center-state.offline{transform:translateY(0);opacity:1}
.app.is-loading .center-state.brand{transform:translateY(120%);opacity:0}
.app.is-loading .center-state.offline{transform:translateY(-120%);opacity:0}
.app.is-loading .center-state.loading{transform:translateY(0);opacity:1}
.red-dot{width:8px;height:8px;border-radius:999px;background:#EF4444;box-shadow:0 0 0 4px rgba(239,68,68,.18);display:inline-block}
.brand-logo{width:18px;height:18px;border-radius:5px;object-fit:cover}
.loading-dots{display:inline-flex;gap:3px}
.loading-dots span{width:4px;height:4px;background:var(--purple);border-radius:999px;animation:b 1s infinite}
.loading-dots span:nth-child(2){animation-delay:.15s}

@keyframes b{0%,80%,100%{transform:translateY(0);opacity:.6}40%{transform:translateY(-3px);opacity:1}}
.center-name{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
.center-status{font-size:11px;color:#8B8BA3}
.messages{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 12px 12px;display:flex;flex-direction:column;gap:2px}
.date-sep{text-align:center;margin:14px 0 8px;font-size:11px;font-weight:700;color:#8B8BA3;background:rgba(244,242,255,.8);padding:6px 12px;border-radius:999px;align-self:center;flex-shrink:0}
.msg-row{display:flex;gap:8px;margin:2px 0;max-width:82%;align-self:flex-end;flex-direction:row-reverse;flex-shrink:0}
.bubble{padding:10px 12px;border-radius:18px;border-bottom-right-radius:6px;background:var(--grad);color:white;word-break:break-word;white-space:pre-wrap;line-height:1.35;font-size:14px;box-shadow:0 4px 16px rgba(124,58,237,.18)}
.bubble img.msg-img{max-width:200px;max-height:260px;border-radius:12px;display:block;margin:2px 0;cursor:pointer;background:#EDE9FF}
.bubble a.msg-link{color:white;text-decoration:underline;text-underline-offset:3px;font-weight:600;word-break:break-all}
.bubble a.msg-link:hover{opacity:.85}
.reply-preview{background:rgba(255,255,255,.18);border-left:3px solid white;padding:6px 8px;border-radius:8px;margin-bottom:6px;font-size:12px;cursor:pointer}
.meta{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:10px;opacity:.8;justify-content:flex-end}
.composer-wrap{flex-shrink:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,0.86);backdrop-filter:blur(36px) saturate(220%);border-top:1px solid rgba(124,58,237,.08);z-index:15}
.composer{background:rgba(255,255,255,0.82);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,0.8);border-radius:24px;padding:6px 6px 6px 10px;display:flex;align-items:flex-end;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.composer textarea{flex:1;border:none;background:transparent;outline:none;resize:none;max-height:110px;min-height:22px;font-size:14px;padding:8px 4px}
.icon-mini{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.send-btn{width:38px;height:38px;border-radius:999px;background:var(--grad);color:white;display:none;place-items:center;cursor:pointer;flex-shrink:0}
.send-btn.show{display:grid}
.reply-bar{display:none;background:rgba(244,242,255,.9);border-left:3px solid var(--purple);padding:8px 10px;border-radius:12px;margin-bottom:8px;align-items:center;justify-content:space-between}
.reply-bar.show{display:flex}
.popup{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);pointer-events:none;opacity:0;transition:opacity.35s ease}
.popup.show{pointer-events:auto;opacity:1;background:rgba(20,10,50,.18);backdrop-filter:blur(18px) saturate(180%)}
.sheet{width:100%;max-width:480px;background:rgba(255,255,255,0.96);backdrop-filter:blur(40px) saturate(200%);border-radius:28px 28px 0 0;padding:14px 16px 30px;transform:translateY(100%);transition:transform.55s cubic-bezier(0.32,0.72,0,1)}
.popup.show .sheet{transform:translateY(0)}
.sheet button{width:100%;padding:16px;border:none;background:rgba(244,242,255,.8);border-radius:14px;margin-bottom:8px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.sheet button.danger{color:#EF4444;background:rgba(239,68,68,.08)}
.handle{width:36px;height:4px;background:rgba(0,0,0,.15);border-radius:999px;margin:0 auto 16px}
.img-viewer{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.92);display:none;place-items:center;padding:20px}
.img-viewer.show{display:grid}
.img-viewer img{max-width:100%;max-height:85vh;border-radius:16px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-150%);z-index:999;background:rgba(255,255,255,0.94);backdrop-filter:blur(20px);padding:10px 14px;border-radius:999px;font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.12);transition:.5s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>

<div id="toast"></div>
<div class="app" id="appRoot">
  <div class="top">
    <div class="island left" id="backBtn"><span class="material-icons-round">arrow_back</span></div>
    <div class="island center">
      <div class="center-states">
        <div class="center-state brand"><div class="center-name"><img src="/pingram.png" class="brand-logo"><span style="background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Saved Messages</span></div><div class="center-status">Private cloud</div></div>
        <div class="center-state loading"><span style="font-weight:700;font-size:12px;color:#6B7280">Loading</span><span class="loading-dots"><span></span><span></span><span></span></span></div>
        <div class="center-state offline"><span class="red-dot"></span><span style="font-weight:700;font-size:12px;color:#111">No connection</span></div>
      </div>
    </div>
    <div class="island" style="width:42px;height:42px;justify-content:center"><span class="material-icons-round">lock</span></div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="composer-wrap">
    <div class="reply-bar" id="replyBar"><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:12px;color:var(--purple)">Replying</div><div id="replyText" style="font-size:12px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div><span class="material-icons-round" id="closeReply" style="cursor:pointer">close</span></div>
    <div id="editBar" class="reply-bar" style="border-left-color:#F59E0B"><div style="flex:1"><div style="font-weight:700;font-size:12px;color:#F59E0B">Editing</div><div id="editText" style="font-size:12px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div><span class="material-icons-round" id="closeEdit" style="cursor:pointer">close</span></div>

      <div class="icon-mini" id="imgBtn"><span class="material-icons-round">image</span></div>
      <textarea id="msgInput" placeholder="Write a note..." rows="1"></textarea>
      <div class="send-btn" id="sendBtn"><span class="material-icons-round">send</span></div>

    <div id="imgPreview" style="display:none;margin-top:8px;position:relative;width:90px"><img id="previewImg" style="width:90px;height:90px;border-radius:12px;object-fit:cover"><span class="material-icons-round" id="removePreview" style="position:absolute;top:-6px;right:-6px;background:white;border-radius:999px;font-size:18px;cursor:pointer">close</span></div>
  </div>
</div>

<div class="popup" id="msgSheet"><div class="sheet"><div class="handle"></div>
  <button id="actReply"><span class="material-icons-round">reply</span>Reply</button>
  <button id="actCopy"><span class="material-icons-round">content_copy</span>Copy</button>
  <button id="actShare"><span class="material-icons-round">share</span>Share</button>
  <button id="actEdit"><span class="material-icons-round">edit</span>Edit</button>
  <button id="actDelete" class="danger"><span class="material-icons-round">delete</span>Delete</button>
  <button onclick="closePop('msgSheet')" style="justify-content:center;background:white;border:1px solid #E5E7EB">Cancel</button>
</div></div>

<div class="img-viewer" id="imgViewer"><img id="viewerImg"><button class="icon-mini" style="position:absolute;top:16px;right:16px;background:white" onclick="$('imgViewer').classList.remove('show')"><span class="material-icons-round">close</span></button></div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
// PWA fix - keeps input visible in installed app
function fixPWASaved(){
  const app=document.getElementById('appRoot');
  if(!app) return;
  if(window.visualViewport){
    app.style.height = window.visualViewport.height + 'px';
  }
}
window.visualViewport && window.visualViewport.addEventListener('resize', fixPWASaved);
window.addEventListener('resize', fixPWASaved);
fixPWASaved();

const supa = supabase.createClient(PINGR_CONFIG.SUPABASE_URL, PINGR_CONFIG.SUPABASE_ANON_KEY);
const $ = id=>document.getElementById(id);
let myUser=null, replyTo=null, editMsg=null, selectedMsg=null, pendingImageFile=null;
let messagesCache=[];

function isOnline(){ return navigator.onLine; }
function setNetworkState(online){
  const root=$('appRoot'); if(!root) return;
  if(online) root.classList.remove('no-internet');
  else root.classList.add('no-internet');
}
function setLoadingState(loading){
  const root=$('appRoot');
  if(loading && isOnline()) root.classList.add('is-loading');
  else root.classList.remove('is-loading');
}
window.addEventListener('offline', ()=> setNetworkState(false));
window.addEventListener('online', ()=>{ setNetworkState(true); loadMessages(); });
setNetworkState(isOnline());

function toast(m){ $('toast').textContent=m; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'),2200); }
function closePop(id){ $(id).classList.remove('show'); }
function openPop(id){ $(id).classList.add('show'); }
function formatTime(d){ return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function dateLabel(d){ const date=new Date(d); const now=new Date(); const diff=Math.floor((now-date)/86400000); if(diff===0) return 'Today'; if(diff===1) return 'Yesterday'; return date.toLocaleDateString(undefined,{weekday:'long'}); }
function escapeHtml(t){ const div=document.createElement('div'); div.textContent=t; return div.innerHTML; }

function linkify(text){
  const escaped = escapeHtml(text);
  const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+|[a-zA-Z0-9-]+\.[a-zA-Z]{2,}(?:\/[^\s]*)?)/gi;
  return escaped.replace(urlRegex, (url)=>{
    let href = url;
    if(!href.startsWith('http')) href = 'https://' + href;
    if(href.length<5 || !href.includes('.')) return url;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="msg-link" onclick="event.stopPropagation()">${url}</a>`;
  });
}
function handleImgError(img){ img.style.display='none'; }

async function init(){
  const token=localStorage.getItem('pingr_session_token'); const uid=localStorage.getItem('pingr_user_id');
  if(!token||!uid){ location.href='/login'; return; }
  try{
    const {data:user}=await supa.from('pingr_users').select('*').eq('id',uid).single();
    myUser=user;
  }catch(e){ if(!isOnline()){ const cached=localStorage.getItem('pingr_user_cache'); if(cached) myUser=JSON.parse(cached); } }
  await loadMessages(); subscribe();
}

async function loadMessages(){
  setLoadingState(true);
  if(!isOnline()){
    const cached=localStorage.getItem('pingr_saved_cache');
    if(cached){ messagesCache=JSON.parse(cached); renderMessages(); }
    setLoadingState(false);
    return;
  }
  try{
    const {data, error}=await supa.from('pingr_saved').select('*, reply:reply_to_id(id,content)').eq('user_id',myUser.id).eq('is_deleted',false).order('created_at',{ascending:true}).limit(200);
    if(error) throw error;
    messagesCache=data||[];
    localStorage.setItem('pingr_saved_cache', JSON.stringify(messagesCache));
    renderMessages();
  }catch(e){
    const cached=localStorage.getItem('pingr_saved_cache');
    if(cached){ messagesCache=JSON.parse(cached); renderMessages(); }
  } finally { setLoadingState(false); }
}

function renderMessages(){
  const box=$('messages'); box.innerHTML='';
  if(messagesCache.length===0){ box.innerHTML=`<div style="flex:1;display:grid;place-items:center;padding:40px;text-align:center;color:#8B8BA3"><div><div style="width:80px;height:80px;background:rgba(124,58,237,.08);border-radius:24px;display:inline-grid;place-items:center;margin-bottom:12px"><span class="material-icons-round" style="font-size:36px;color:#7C3AED">bookmark</span></div><h3 style="font-weight:800;color:#111">Saved Messages</h3><p style="font-size:13px;margin-top:6px;line-height:1.4">Your private cloud. Save notes, links,<br>images and ideas here.</p></div></div>`; return; }
  let lastDate='';
  messagesCache.forEach(m=>{
    const dLabel=dateLabel(m.created_at);
    if(dLabel!==lastDate){ const sep=document.createElement('div'); sep.className='date-sep'; sep.textContent=dLabel; box.appendChild(sep); lastDate=dLabel; }
    const row=document.createElement('div'); row.className='msg-row'; row.dataset.id=m.id;
    let replyHtml=''; if(m.reply_to_id){ const rep=messagesCache.find(x=>x.id===m.reply_to_id); if(rep){ replyHtml=`<div class="reply-preview" onclick="scrollToMsg('${rep.id}')">${(rep.content||'📷 Image').slice(0,60)}</div>`; } }
    let imgHtml=''; if(m.image_url) imgHtml=`<img src="${m.image_url}" class="msg-img" onerror="handleImgError(this)" onclick="openViewer('${m.image_url}')">`;
    let contentHtml=m.content? `<div>${linkify(m.content)}</div>` : '';
    let editedHtml=m.is_edited? `<span style="font-style:italic;font-size:10px;opacity:.7">Edited</span>` : '';
    row.innerHTML=`<div class="bubble">${replyHtml}${imgHtml}${contentHtml}<div class="meta"><span>${formatTime(m.created_at)}</span> ${editedHtml}</div></div>`;
    row.addEventListener('contextmenu',e=>{ e.preventDefault(); openActions(m); });
    let t; row.addEventListener('touchstart',()=>{ t=setTimeout(()=>openActions(m),500); }); row.addEventListener('touchend',()=>clearTimeout(t));
    box.appendChild(row);
  });
  box.scrollTop=box.scrollHeight;
}

function openActions(m){ selectedMsg=m; openPop('msgSheet'); }
function scrollToMsg(id){ const el=document.querySelector(`[data-id="${id}"]`); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.outline='2px solid #7C3AED'; setTimeout(()=>el.style.outline='none',1000); } }

$('actReply').onclick=()=>{ if(!selectedMsg) return; replyTo=selectedMsg; $('replyText').textContent=(selectedMsg.content||'📷 Image').slice(0,80); $('replyBar').classList.add('show'); closePop('msgSheet'); $('msgInput').focus(); };
$('actCopy').onclick=()=>{ if(selectedMsg?.content){ navigator.clipboard.writeText(selectedMsg.content); toast('Copied'); } closePop('msgSheet'); };
$('actShare').onclick=()=>{ if(selectedMsg?.content && navigator.share){ navigator.share({text:selectedMsg.content}); } closePop('msgSheet'); };
$('actEdit').onclick=()=>{ if(!selectedMsg) return; editMsg=selectedMsg; $('editText').textContent=(selectedMsg.content||'').slice(0,80); $('editBar').classList.add('show'); $('msgInput').value=selectedMsg.content; $('msgInput').focus(); checkSend(); closePop('msgSheet'); };
$('actDelete').onclick=async()=>{ if(!selectedMsg) return; if(!isOnline()){ toast('No internet'); return; } await supa.from('pingr_saved').update({is_deleted:true}).eq('id',selectedMsg.id); closePop('msgSheet'); };
$('closeReply').onclick=()=>{ replyTo=null; $('replyBar').classList.remove('show'); };
$('closeEdit').onclick=()=>{ editMsg=null; $('editBar').classList.remove('show'); $('msgInput').value=''; checkSend(); };

$('imgBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{ const f=e.target.files[0]; if(!f) return; pendingImageFile=f; $('previewImg').src=URL.createObjectURL(f); $('imgPreview').style.display='block'; checkSend(); };
$('removePreview').onclick=()=>{ pendingImageFile=null; $('imgPreview').style.display='none'; checkSend(); };

function checkSend(){ const hasText=$('msgInput').value.trim()!==''; const hasImg=!!pendingImageFile; if(hasText||hasImg) $('sendBtn').classList.add('show'); else $('sendBtn').classList.remove('show'); }
$('msgInput').addEventListener('input',()=>{ $('msgInput').style.height='auto'; $('msgInput').style.height=$('msgInput').scrollHeight+'px'; checkSend(); });
$('msgInput').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } });
$('sendBtn').onclick=sendMessage;

async function sendMessage(){
  const text=$('msgInput').value.trim(); if(!text && !pendingImageFile) return;
  if(!isOnline()){ toast('No internet connection found'); return; }
  let imageUrl='';
  if(pendingImageFile){
    const name=`${myUser.id}/${Date.now()}_${pendingImageFile.name}`;
    const {error}=await supa.storage.from('pingr_saved').upload(name, pendingImageFile);
    if(error){ toast('Upload failed'); return; }
    const {data}=supa.storage.from('pingr_saved').getPublicUrl(name); imageUrl=data.publicUrl;
  }
  if(editMsg){
    await supa.from('pingr_saved').update({content:text, is_edited:true}).eq('id',editMsg.id);
    editMsg=null; $('editBar').classList.remove('show');
  } else {
    await supa.from('pingr_saved').insert({user_id:myUser.id, content:text, image_url:imageUrl, reply_to_id:replyTo?.id||null});
    replyTo=null; $('replyBar').classList.remove('show');
  }
  $('msgInput').value=''; $('msgInput').style.height='auto'; pendingImageFile=null; $('imgPreview').style.display='none'; checkSend();
}

function subscribe(){
  if(!myUser?.id) return;
  supa.channel('saved-'+myUser.id)
  .on('postgres_changes',{event:'*',schema:'public',table:'pingr_saved',filter:`user_id=eq.${myUser.id}`}, payload=>{
    if(payload.eventType==='INSERT'){ supa.from('pingr_saved').select('*, reply:reply_to_id(id,content)').eq('id',payload.new.id).single().then(({data})=>{ messagesCache.push(data); localStorage.setItem('pingr_saved_cache', JSON.stringify(messagesCache)); renderMessages(); }); }
    if(payload.eventType==='UPDATE'){ const idx=messagesCache.findIndex(m=>m.id===payload.new.id); if(idx>-1){ Object.assign(messagesCache[idx],payload.new); localStorage.setItem('pingr_saved_cache', JSON.stringify(messagesCache)); renderMessages(); } else { loadMessages(); } }
    if(payload.eventType==='DELETE' || payload.new?.is_deleted){ messagesCache=messagesCache.filter(m=>m.id!==payload.old?.id && m.id!==payload.new?.id); localStorage.setItem('pingr_saved_cache', JSON.stringify(messagesCache)); renderMessages(); }
  })
  .subscribe();
}

function openViewer(url){ $('viewerImg').src=url; $('imgViewer').classList.add('show'); }
$('backBtn').onclick=()=>{ location.href='/home'; };
window.handleImgError = handleImgError;

init();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js'); }
</script>
