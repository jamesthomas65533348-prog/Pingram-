<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PINGRAM - Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--purple:#7C3AED;--blue:#3B82F6;--grad:linear-gradient(135deg,#7C3AED 0%,#3B82F6 100%)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent!important;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important}
input,textarea{-webkit-user-select:text!important;user-select:text!important}
body{min-height:100dvh;display:flex;justify-content:center;background: radial-gradient(120% 120% at 0% 0%, #C4B5FD 0%, transparent 50%), radial-gradient(100% 100% at 100% 0%, #93C5FD 0%, transparent 50%), linear-gradient(180deg, #F8F7FF 0%, #FFFFFF 100%);background-attachment:fixed;overflow:hidden}
.app{width:100%;max-width:480px;height:100dvh;background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, #FFFFFF 100%);display:flex;flex-direction:column;position:relative;overflow:hidden}
.top-bar{padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(12px + env(safe-area-inset-top));z-index:20}
.island{background:rgba(255,255,255,0.82);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,0.8);box-shadow:0 8px 24px rgba(0,0,0,.06);border-radius:999px;display:flex;align-items:center}
.island.left{padding:3px;width:48px;height:48px;justify-content:center;cursor:pointer;overflow:hidden}
.island.center{padding:8px 18px;font-weight:800;font-size:18px;letter-spacing:1px;flex:1;justify-content:center;max-width:150px;font-family:'Agency FB', sans-serif;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.island.right{padding:6px;width:48px;height:48px;justify-content:center;cursor:pointer}
.avatar-img{width:40px;height:40px;border-radius:999px;object-fit:cover;flex-shrink:0}
.avatar-initials{width:40px;height:40px;border-radius:999px;background:var(--grad);display:grid;place-items:center;color:white;font-weight:800;font-size:14px;flex-shrink:0}
.avatar-initials.lg{width:52px;height:52px;font-size:16px}
.avatar-initials.xl{width:80px;height:80px;font-size:26px}
.avatar-initials.xxl{width:110px;height:110px;font-size:38px;border:4px solid white}
.search-expand{position:absolute;top:0;left:0;right:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(30px) saturate(200%);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;gap:10px;align-items:center;transform:translateY(-100%);transition:transform.45s cubic-bezier(0.32,0.72,0,1);z-index:60}
.search-expand.show{transform:translateY(0)}
.search-expand input{flex:1;padding:14px 16px;background:rgba(244,242,255,.9);border:1.5px solid transparent;border-radius:14px;outline:none;font-size:14px}
#searchBackdrop{position:absolute;inset:0;background:rgba(0,0,0,0.08);backdrop-filter:blur(2px);z-index:55;display:none}
#searchBackdrop.show{display:block}
.content{flex:1;overflow-y:auto;padding:12px 0 calc(90px + env(safe-area-inset-bottom))}
.skeleton{padding:12px 16px;display:flex;gap:12px;align-items:center;animation:shimmer 1.5s infinite}
.skeleton.av{width:52px;height:52px;background:#F4F2FF;border-radius:999px}
.skeleton.line{height:12px;background:#F4F2FF;border-radius:8px;margin-bottom:8px}
@keyframes shimmer{0%,100%{opacity:.6}50%{opacity:1}}
.chat-item{display:flex;gap:12px;padding:12px 16px;align-items:center;cursor:pointer}
.chat-main{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;align-items:center}
.chat-name{font-weight:700;font-size:14px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:11px;color:#8B8BA3}
.chat-last{font-size:13px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;max-width:220px}
.chat-last.unread{font-weight:800;color:#111}
.chat-name.unread{font-weight:800}.empty{padding:60px 24px;text-align:center}
.bottom-nav{padding:12px 12px calc(28px + env(safe-area-inset-bottom));display:flex;gap:10px;background:rgba(255,255,255,0.96);backdrop-filter:blur(30px) saturate(200%);border-top:1px solid rgba(124,58,237,.08);position:relative;z-index:30;flex-shrink:0}
.nav-tab{flex:1;padding:12px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#8B8BA3;cursor:pointer}
.nav-tab.active{background:rgba(124,58,237,.08);color:var(--purple)}
.popup{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);pointer-events:none;opacity:0;transition:opacity.35s ease}
.popup.show{pointer-events:auto;opacity:1;background:rgba(20,10,50,.18);backdrop-filter:blur(18px) saturate(180%)}
.sheet{width:100%;max-width:480px;background:rgba(255,255,255,0.94);backdrop-filter:blur(40px) saturate(200%);border-radius:32px 32px 0 0;padding:14px 16px 30px;transform:translateY(100%);transition:transform.55s cubic-bezier(0.32,0.72,0,1)}
.popup.show .sheet{transform:translateY(0)}
.confirm-card{width:100%;max-width:480px;background:rgba(255,255,255,0.94);backdrop-filter:blur(40px) saturate(200%);border-radius:32px 32px 0 0;padding:20px 20px 30px;transform:translateY(100%);transition:transform.55s cubic-bezier(0.32,0.72,0,1)}
.popup.show .confirm-card{transform:translateY(0)}
.handle{width:36px;height:4px;background:rgba(0,0,0,.15);border-radius:999px;margin:0 auto 18px}
.sheet button{width:100%;padding:16px;border:none;background:rgba(244,242,255,.8);border-radius:14px;margin-bottom:8px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.sheet button.danger{color:#EF4444;background:rgba(239,68,68,.08)}
#inAppNotif{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-150%);width:calc(100% - 24px);max-width:440px;background:rgba(255,255,255,0.88);backdrop-filter:blur(30px) saturate(200%);border:1px solid rgba(255,255,255,0.8);border-radius:20px;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.12);z-index:200;transition:transform.6s cubic-bezier(0.32,0.72,0,1);cursor:pointer}
#inAppNotif.show{transform:translateX(-50%) translateY(0)}
.profile-modal{position:fixed;inset:0;z-index:90;background:white;display:none;flex-direction:column}
.profile-modal.show{display:flex}
.cover{height:420px;background:var(--grad);position:relative;overflow:hidden;display:grid;place-items:center}
.cover img.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover .overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 100%);z-index:1}
.cover .top-actions{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;z-index:5;padding:12px;padding-top:calc(12px + env(safe-area-inset-top))}
.icon-btn{width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.8);box-shadow:0 8px 24px rgba(0,0,0,.15);display:grid;place-items:center;cursor:pointer}
.island-btn{background:rgba(255,255,255,0.9);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,0.8);box-shadow:0 8px 24px rgba(0,0,0,.12);border-radius:999px;}
.crop-modal{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.85);display:none;place-items:center;padding:20px}
.crop-modal.show{display:grid}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-150%);z-index:9999;background:rgba(255,255,255,0.92);backdrop-filter:blur(28px);border-radius:18px;padding:10px 14px;font-size:12.5px;font-weight:600;max-width:300px;transition:transform.6s cubic-bezier(0.32,0.72,0,1);pointer-events:none;display:flex;align-items:center;gap:8px}
#toast.show{transform:translateX(-50%) translateY(0)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(244,242,255,.6);border-radius:14px;margin-bottom:10px}
.setting-row input{border:none;background:transparent;outline:none;font-size:14px;flex:1}
.toggle{width:44px;height:26px;background:#E5E7EB;border-radius:999px;position:relative;cursor:pointer;transition:.3s}
.toggle.on{background:var(--purple)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:white;border-radius:999px;top:3px;left:3px;transition:.3s}
.toggle.on::after{left:21px}
.online-dot{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:999px;border:2px solid white}
.online-dot.on{background:#10B981}.online-dot.off{background:#9CA3AF}
</style>
</head>
<body>
<div id="toast"><span id="toast-text"></span></div>
<div id="inAppNotif"><div id="notifAvatar"></div><div style="flex:1;min-width:0"><div id="notifName" style="font-weight:700;font-size:13px"></div><div id="notifText" style="font-size:12px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div></div>

<div class="app">
  <div class="top-bar">
    <div class="island left" id="profileIsland"><div id="myAvatar"></div></div>
    <div class="island center">PINGRAM</div>
    <div class="island right" id="searchIsland"><span class="material-icons-round">search</span></div>
  </div>
  <div class="search-expand" id="searchExpand">
    <input id="searchInput" placeholder="Username or phone">
    <button id="searchBtn" style="padding:12px 16px;background:var(--grad);color:white;border:none;border-radius:12px;font-weight:700">Search</button>
    <span class="material-icons-round" id="closeSearch" style="cursor:pointer">close</span>
  </div>
  <div id="searchBackdrop"></div>

  <div class="content" id="content">
    <div id="chatsList"></div>
    <div id="settingsView" style="display:none;padding:16px;overflow-y:auto">
      <div style="text-align:center;padding:16px"><div id="settingsAvatar" style="display:inline-grid"></div><h3 id="settingsName" style="margin-top:12px;font-size:18px;font-weight:800"></h3><p id="settingsUsername" style="color:#8B8BA3;font-size:13px"></p></div>
            <div style="margin-top:10px">
        <div style="font-size:11px;font-weight:700;color:#8B8BA3;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase">Profile</div>
        <div class="setting-row"><span style="font-size:13px;font-weight:600;min-width:90px">First Name</span><input id="firstNameInput" placeholder="First name"></div>
        <div class="setting-row"><span style="font-size:13px;font-weight:600;min-width:90px">Last Name</span><input id="lastNameInput" placeholder="Last name"></div>
        <div class="setting-row"><span style="font-size:13px;font-weight:600;min-width:90px">Username</span><input id="usernameInput" placeholder="username"></div>
        <div class="setting-row"><span style="font-size:13px;font-weight:600">Bio</span><input id="bioInput" placeholder="Add bio"></div>
        <div class="setting-row"><span style="font-size:13px;font-weight:600">Hide Username</span><div id="hideToggle" class="toggle"></div></div>
        <button id="saveProfileBtn" style="width:100%;padding:14px;background:var(--grad);color:white;border:none;border-radius:12px;font-weight:700;margin-top:8px">Save Profile</button>
      </div>
      <div style="margin-top:20px"><div style="font-size:11px;font-weight:700;color:#8B8BA3;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase">Blocked Users</div><div id="blockedList">Loading...</div></div>
      <div style="margin-top:20px"><div style="font-size:11px;font-weight:700;color:#8B8BA3;letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase">App</div><div class="setting-row"><span style="font-size:13px">Version</span><span style="font-size:12px;color:#8B8BA3">PINGRAM v1.0</span></div></div>
      <button id="logoutBtn" style="width:100%;padding:16px;background:rgba(239,68,68,.08);border:none;border-radius:14px;color:#EF4444;font-weight:700;margin-top:24px">Logout</button>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-tab active" data-tab="chats"><span class="material-icons-round">chat_bubble</span>Chats</div>
    <div class="nav-tab" data-tab="settings"><span class="material-icons-round">settings</span>Settings</div>
  </div>
</div>

<div class="popup" id="picSheet"><div class="sheet"><div class="handle"></div>
  <button id="viewPicBtn"><span class="material-icons-round">visibility</span>View Picture</button>
  <button id="uploadPicBtn"><span class="material-icons-round">upload</span>Change Picture</button>
  <button id="removePicBtn" class="danger"><span class="material-icons-round">delete</span>Remove Picture</button>
  <button onclick="closePop('picSheet')" style="justify-content:center;background:white;border:1px solid #E5E7EB">Cancel</button>
</div></div>

<div class="profile-modal" id="profileModal">
    <div class="cover" id="profileCover">
    <img id="coverFullImg" class="full" style="display:none">
    <div id="coverInitials" style="z-index:2"></div>
    <div class="overlay"></div>
    <div class="top-actions">
      <button class="icon-btn island-btn" onclick="closeProfile()"><span class="material-icons-round">arrow_back</span></button>
      <div></div>
    </div>
    <button class="icon-btn island-btn" id="downloadPicBtn" style="display:none;position:absolute;bottom:16px;right:16px;z-index:5"><span class="material-icons-round">download</span></button>
  </div>
  <div style="padding:20px">
    <h2 id="profName" style="font-size:22px;font-weight:800"></h2>
    <p id="profUsername" style="color:var(--purple);font-weight:600;margin-top:4px"></p>
    <p id="profBio" style="color:#6B7280;margin-top:12px;font-size:14px"></p>
    <p id="profStatus" style="margin-top:12px;font-size:12px;font-weight:600"></p>
    <button id="startChatBtn" style="width:100%;padding:16px;background:var(--grad);color:white;border:none;border-radius:999px;font-weight:700;margin-top:20px">Start Chat</button>
    <button id="blockBtn" style="width:100%;padding:14px;background:rgba(239,68,68,.08);border:none;border-radius:999px;color:#EF4444;font-weight:700;margin-top:10px">Block User</button>
  </div>
</div>

<div class="popup" id="confirmPopup"><div class="confirm-card"><div class="handle"></div>
  <div style="text-align:center">
    <div style="width:60px;height:60px;background:rgba(239,68,68,.1);border-radius:18px;display:inline-grid;place-items:center;margin-bottom:14px"><span class="material-icons-round" style="color:#EF4444;font-size:28px">block</span></div>
    <h3 id="confirmTitle" style="font-size:18px;font-weight:800">Block User?</h3>
    <p id="confirmText" style="font-size:13px;color:#6B7280;margin-top:8px;line-height:1.5">This will delete all chats to save storage.</p>
    <div style="display:flex;gap:10px;margin-top:20px"><button onclick="closePop('confirmPopup')" style="flex:1;padding:14px;background:rgba(244,242,255,.8);border:none;border-radius:12px;font-weight:600">Cancel</button><button id="confirmYes" style="flex:1;padding:14px;background:#EF4444;color:white;border:none;border-radius:12px;font-weight:700">Block</button></div>
  </div>
</div></div>

<div class="popup" id="downloadSheet"><div class="sheet" style="text-align:center"><div class="handle"></div>
  <div style="width:64px;height:64px;background:var(--grad);border-radius:20px;display:inline-grid;place-items:center;margin-bottom:12px"><span class="material-icons-round" style="color:white;font-size:28px">download</span></div>
  <h3 style="font-size:18px;font-weight:800">Save Photo?</h3>
  <p style="font-size:13px;color:#6B7280;margin-top:6px">Save <span id="dlName"></span>'s photo to gallery?</p>
  <div style="display:flex;gap:10px;margin-top:18px"><button onclick="closePop('downloadSheet')" style="flex:1;padding:14px;background:rgba(244,242,255,.8);border:none;border-radius:12px;font-weight:600">Cancel</button><button id="confirmDownload" style="flex:1;padding:14px;background:var(--grad);color:white;border:none;border-radius:12px;font-weight:700">Save</button></div>
</div></div>

<div class="crop-modal" id="cropModal"><div style="background:white;border-radius:20px;padding:16px;max-width:400px;width:100%">
  <h3 style="font-weight:800;margin-bottom:12px">Crop</h3>
  <canvas id="cropCanvas" width="300" height="300" style="width:100%;background:#F4F2FF;border-radius:16px"></canvas>
  <div style="display:flex;gap:10px;margin-top:12px">
    <button id="cancelCrop" style="flex:1;padding:14px;border:1px solid #E5E7EB;background:white;border-radius:12px;font-weight:600">Cancel</button>
    <button id="saveCrop" style="flex:1;padding:14px;background:var(--grad);color:white;border:none;border-radius:12px;font-weight:700">Save</button>
  </div>
</div></div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
const supa = supabase.createClient(PINGR_CONFIG.SUPABASE_URL, PINGR_CONFIG.SUPABASE_ANON_KEY);
const $ = id=>document.getElementById(id);
let myUser=null, currentOtherUser=null;

function getInitials(fn, ln){ const f=(fn||'').trim()[0]||''; const l=(ln||'').trim()[0]||''; return (f+l).toUpperCase()||'P'; }
function avatarHTML(user, sizeClass=''){
  if(user?.profile_photo_url && user.profile_photo_url!==''){ return `<img src="${user.profile_photo_url}" class="avatar-img ${sizeClass}" style="${sizeClass.includes('lg')?'width:52px;height:52px':''} ${sizeClass.includes('xl')?'width:80px;height:80px':''} ${sizeClass.includes('xxl')?'width:110px;height:110px;border:4px solid white':''}">`; }
  else { const initials=getInitials(user?.first_name, user?.last_name); return `<div class="avatar-initials ${sizeClass}">${initials}</div>`; }
}
function renderAvatar(containerId, user, sizeClass=''){ $(containerId).innerHTML = avatarHTML(user, sizeClass); }
function toast(msg){ $('toast-text').textContent=msg; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'), 2500); }
function closePop(id){ document.getElementById(id).classList.remove('show'); }
function openPop(id){ document.getElementById(id).classList.add('show'); }
function showConfirm(title, text, onYes){ $('confirmTitle').textContent=title; $('confirmText').textContent=text; openPop('confirmPopup'); $('confirmYes').onclick=()=>{ closePop('confirmPopup'); onYes(); }; }
function isReallyOnline(user){ if(!user?.is_online) return false; return (Date.now() - new Date(user.last_seen).getTime()) < 3*60*1000; }

async function downloadImage(url, name){
  try{
    toast('Downloading...');
    const res = await fetch(url);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (name||'pingram')+'.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('Saved to gallery');
  }catch(e){ window.open(url,'_blank'); }
}

function setOnlineStatus(online){
  const uid=localStorage.getItem('pingr_user_id'); if(!uid) return;
  if(!online){
    supa.from('pingr_users').update({is_online:false, last_seen:new Date().toISOString()}).eq('id',uid).then(()=>{});
  } else {
    supa.rpc('update_online_status',{my_id:uid, online:true}).then(()=>{});
  }
}

(async()=>{
  const token=localStorage.getItem('pingr_session_token'); const uid=localStorage.getItem('pingr_user_id');
  if(!token||!uid){ location.href='login.html'; return; }
  const {data}=await supa.rpc('validate_pingr_session',{session_token:token});
  if(!data||!data[0]?.is_valid){ localStorage.clear(); location.href='login.html'; return; }
  const {data:user}=await supa.from('pingr_users').select('*').eq('id',uid).single();
  if(!user){ location.href='login.html'; return; }
  myUser=user;
  renderAvatar('myAvatar',user,''); renderAvatar('settingsAvatar',user,'xl');
    $('settingsName').textContent=user.first_name+' '+user.last_name;
  $('settingsUsername').textContent='@'+user.username;
  $('firstNameInput').value=user.first_name||'';
  $('lastNameInput').value=user.last_name||'';
  $('usernameInput').value=user.username||'';
  $('bioInput').value=user.bio||''; 
  $('hideToggle').classList.toggle('on',!!user.hide_username);

  setOnlineStatus(true);
  loadChats(); loadBlocked(); subscribeRealtime();

  setInterval(()=>setOnlineStatus(true), 40000);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) setOnlineStatus(false); else setOnlineStatus(true); });
  window.addEventListener('pagehide', ()=>setOnlineStatus(false));
  window.addEventListener('beforeunload', ()=>setOnlineStatus(false));
  window.addEventListener('focus', ()=>setOnlineStatus(true));
})();

function showSkeleton(){ const list=$('chatsList'); list.innerHTML=''; for(let i=0;i<5;i++){ const d=document.createElement('div'); d.className='skeleton'; d.innerHTML=`<div class="skeleton av"></div><div style="flex:1"><div class="skeleton line" style="width:40%"></div><div class="skeleton line" style="width:70%"></div></div>`; list.appendChild(d);} }
async function loadChats(){
  showSkeleton(); const uid=localStorage.getItem('pingr_user_id'); const {data, error}=await supa.rpc('get_pingr_chats',{my_id:uid}); const list=$('chatsList'); list.innerHTML='';
  if(error){ list.innerHTML=`<div class="empty"><p style="color:#EF4444">Error: ${error.message}</p></div>`; return; }
  if(!data||data.length===0){ list.innerHTML=`<div class="empty"><div style="width:80px;height:80px;background:rgba(124,58,237,.08);border-radius:24px;display:inline-grid;place-items:center;margin-bottom:16px"><span class="material-icons-round" style="font-size:36px;color:#7C3AED">forum</span></div><h3 style="font-weight:800">No conversations yet</h3><p style="font-size:13px;color:#8B8BA3;margin-top:8px">Search for friends to start chatting.</p><button onclick="document.getElementById('searchIsland').click()" style="margin-top:16px;padding:12px 20px;background:var(--grad);color:white;border:none;border-radius:999px;font-weight:700">Search Friends</button></div>`; return; }
    data.forEach(c=>{
    const other={first_name:c.other_first_name, last_name:c.other_last_name, profile_photo_url:c.other_photo, is_online:c.is_online, last_seen:c.last_seen};
    const online = isReallyOnline(other);
    const isUnread = (c.unread_count && c.unread_count>0) || (c.last_sender_id && c.last_sender_id!==uid && c.last_is_read===false);
    const item=document.createElement('div'); item.className='chat-item';
    item.innerHTML=`<div style="position:relative">${avatarHTML(other,'lg')}<div class="online-dot ${online?'on':'off'}"></div></div><div class="chat-main"><div class="chat-top"><div class="chat-name ${isUnread?'unread':''}">${c.other_first_name} ${c.other_last_name}</div><div class="chat-time" style="${isUnread?'font-weight:800;color:#111':''}">${c.last_message_at? new Date(c.last_message_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</div></div><div class="chat-last ${isUnread?'unread':''}">${c.has_image?'📷 Image':(c.last_message||'No messages yet')}</div></div>`;
    item.onclick=()=>{ location.href=`chat.html?conversation_id=${c.conversation_id}`; };
    let pressTimer; item.addEventListener('touchstart', ()=>{ pressTimer=setTimeout(()=>openUserProfile(c.other_user_id),600); }); item.addEventListener('touchend', ()=>clearTimeout(pressTimer));
    list.appendChild(item);
  });
}
async function loadBlocked(){
  const {data}=await supa.from('pingr_blocked').select('blocked_id').eq('blocker_id',myUser.id); const list=$('blockedList');
  if(!data||data.length===0){ list.innerHTML='<span style="color:#8B8BA3">No blocked users</span>'; return; }
  list.innerHTML='Loading...'; const ids=data.map(d=>d.blocked_id); const {data:users}=await supa.from('pingr_users').select('id,first_name,last_name,username,profile_photo_url').in('id',ids); list.innerHTML='';
  (users||[]).forEach(u=>{
    const row=document.createElement('div'); row.className='setting-row';
    row.innerHTML=`<div style="display:flex;align-items:center;gap:10px">${avatarHTML(u,'')} <div><div style="font-weight:600;font-size:13px">${u.first_name} ${u.last_name}</div><div style="font-size:11px;color:#8B8BA3">@${u.username}</div></div></div><button style="padding:6px 12px;background:rgba(124,58,237,.08);border:none;border-radius:999px;color:var(--purple);font-weight:600;font-size:12px">Unblock</button>`;
    row.querySelector('button').onclick=()=>{ showConfirm('Unblock?', `Unblock ${u.first_name}?`, async()=>{ await supa.rpc('unblock_pingr_user',{blocker:myUser.id, blocked:u.id}); toast('Unblocked'); loadBlocked(); loadChats(); }); };
    list.appendChild(row);
  });
}
function subscribeRealtime(){
  supa.channel('home-chats')
.on('postgres_changes',{event:'*',schema:'public',table:'pingr_messages'},(payload)=>{
    loadChats();
    if(payload.new && payload.new.sender_id!==localStorage.getItem('pingr_user_id')){
      supa.from('pingr_users').select('first_name,last_name,profile_photo_url').eq('id',payload.new.sender_id).single().then(({data})=>{
        if(data){ $('notifAvatar').innerHTML=avatarHTML(data,''); $('notifName').textContent=data.first_name; $('notifText').textContent=payload.new.content||'📷 Image'; $('inAppNotif').classList.add('show'); $('inAppNotif').onclick=()=>{ location.href=`chat.html?conversation_id=${payload.new.conversation_id}`; }; setTimeout(()=>$('inAppNotif').classList.remove('show'),4000); }
      });
    }
  })
.on('postgres_changes',{event:'*',schema:'public',table:'pingr_conversations'},()=>loadChats())
.on('postgres_changes',{event:'*',schema:'public',table:'pingr_users'},()=>loadChats())
.subscribe();
}

$('profileIsland').onclick=()=>{ openPop('picSheet'); };
$('searchIsland').onclick=()=>{ $('searchExpand').classList.add('show'); $('searchBackdrop').classList.add('show'); setTimeout(()=>$('searchInput').focus(),100); };
function closeSearch(){ $('searchExpand').classList.remove('show'); $('searchBackdrop').classList.remove('show'); }
$('closeSearch').onclick=closeSearch;
$('searchBackdrop').onclick=closeSearch;
$('content').addEventListener('click', (e)=>{ if($('searchExpand').classList.contains('show') &&!e.target.closest('#searchExpand')) closeSearch(); });

$('viewPicBtn').onclick=()=>{ if(myUser?.profile_photo_url) window.open(myUser.profile_photo_url,'_blank'); else toast('No picture - '+getInitials(myUser.first_name,myUser.last_name)); closePop('picSheet'); };
$('uploadPicBtn').onclick=()=>{ $('fileInput').click(); closePop('picSheet'); };
$('removePicBtn').onclick=async()=>{ await supa.from('pingr_users').update({profile_photo_url:''}).eq('id',myUser.id); myUser.profile_photo_url=''; renderAvatar('myAvatar',myUser,''); renderAvatar('settingsAvatar',myUser,'xl'); toast('Removed'); closePop('picSheet'); };

$('fileInput').onchange=(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=$('cropCanvas'), ctx=canvas.getContext('2d');
      const size=Math.min(img.width,img.height); const sx=(img.width-size)/2, sy=(img.height-size)/2;
      canvas.width=300; canvas.height=300; ctx.drawImage(img,sx,sy,size,size,0,0,300,300);
      $('cropModal').classList.add('show');
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
};
$('cancelCrop').onclick=()=>$('cropModal').classList.remove('show');
$('saveCrop').onclick=async()=>{
  $('saveCrop').textContent='Uploading...';
  const canvas=$('cropCanvas');
  canvas.toBlob(async (blob)=>{
    try{
      const fileName=`${myUser.id}_${Date.now()}.jpg`;
      const {error} = await supa.storage.from('pingr_profiles').upload(fileName, blob, {upsert:true, contentType:'image/jpeg'});
      if(error) throw error;
      const {data:pub}=supa.storage.from('pingr_profiles').getPublicUrl(fileName);
      await supa.from('pingr_users').update({profile_photo_url:pub.publicUrl}).eq('id',myUser.id);
      myUser.profile_photo_url=pub.publicUrl;
      renderAvatar('myAvatar',myUser,''); renderAvatar('settingsAvatar',myUser,'xl');
      $('cropModal').classList.remove('show'); toast('Profile updated');
    }catch(err){ toast('Failed: '+err.message); }
    $('saveCrop').textContent='Save';
  },'image/jpeg',0.85);
};

$('searchBtn').onclick=async()=>{
  const term=$('searchInput').value.trim(); if(!term){ toast('Enter username or phone'); return; }
  $('searchBtn').textContent='...';
  const {data}=await supa.rpc('search_pingr_user',{search_term:term, my_id:myUser.id});
  $('searchBtn').textContent='Search';
  if(!data||data.length===0){ toast('User not found'); return; }
  const u=data[0]; if(u.is_self){ closeSearch(); location.href='saved.html'; return; }
  closeSearch(); openUserProfile(u.id);
};

async function openUserProfile(userId){
  const {data:user}=await supa.from('pingr_users').select('*').eq('id',userId).single(); if(!user) return;
  currentOtherUser=user;
  const coverImg = $('coverFullImg');
  const initialsWrap = $('coverInitials');
    if(user.profile_photo_url && user.profile_photo_url!==''){
    coverImg.src = user.profile_photo_url;
    coverImg.style.display = 'block';
    initialsWrap.innerHTML = '';
    $('downloadPicBtn').style.display = 'grid';
    coverImg.onclick=()=>window.open(user.profile_photo_url,'_blank');
  } else {
    coverImg.style.display = 'none';
    coverImg.src = '';
    initialsWrap.innerHTML = `<div class="avatar-initials xxl">${getInitials(user.first_name,user.last_name)}</div>`;
    $('downloadPicBtn').style.display = 'none';
    coverImg.onclick=null;
  }
  $('profName').textContent=user.first_name+' '+user.last_name;
  $('profUsername').textContent=user.hide_username?'Username hidden':'@'+user.username;
  $('profBio').textContent=user.bio||'No bio';
  const online=isReallyOnline(user);
  $('profStatus').textContent=online?'● Online':`Last seen ${new Date(user.last_seen).toLocaleString()}`;
  $('profStatus').style.color=online?'#10B981':'#8B8BA3';
  $('profileModal').classList.add('show');
}
window.closeProfile=()=>$('profileModal').classList.remove('show');

$('downloadPicBtn').onclick=()=>{
  if(!currentOtherUser?.profile_photo_url) return;
  $('dlName').textContent=currentOtherUser.first_name;
  openPop('downloadSheet');
};
$('confirmDownload').onclick=()=>{
  closePop('downloadSheet');
  downloadImage(currentOtherUser.profile_photo_url, currentOtherUser.first_name+'_'+currentOtherUser.last_name);
};


$('startChatBtn').onclick=async()=>{
  if(!currentOtherUser) return;
  const myId=myUser.id, otherId=currentOtherUser.id;
  const {data:existing}=await supa.from('pingr_conversations').select('id').or(`and(user1_id.eq.${myId},user2_id.eq.${otherId}),and(user1_id.eq.${otherId},user2_id.eq.${myId})`).limit(1);
  let convId=existing?.[0]?.id;
  if(!convId){ const {data:created}=await supa.from('pingr_conversations').insert({user1_id:myId,user2_id:otherId}).select('id').single(); convId=created?.id; }
  if(convId) location.href=`chat.html?conversation_id=${convId}`;
};
$('blockBtn').onclick=()=>{
  if(!currentOtherUser) return;
  showConfirm('Block User?', `Block ${currentOtherUser.first_name}? Chats will be deleted.`, async()=>{
    await supa.rpc('block_pingr_user',{blocker:myUser.id, blocked:currentOtherUser.id});
    toast('Blocked and deleted'); closeProfile(); loadChats(); loadBlocked();
  });
};
$('hideToggle').onclick=async()=>{
  $('hideToggle').classList.toggle('on'); const hide=$('hideToggle').classList.contains('on');
  const {error}=await supa.from('pingr_users').update({hide_username:hide}).eq('id',myUser.id);
  if(error){ toast('Failed'); $('hideToggle').classList.toggle('on'); return; }
  myUser.hide_username=hide; toast(hide?'Username hidden':'Username visible');
};
$('saveProfileBtn').onclick=async()=>{
  const first=$('firstNameInput').value.trim();
  const last=$('lastNameInput').value.trim();
  const username=$('usernameInput').value.trim().toLowerCase().replace('@','');
  const bio=$('bioInput').value.trim(); 
  const hide=$('hideToggle').classList.contains('on');
  if(!first||!last){ toast('First & last name required'); return; }
  if(!username){ toast('Username required'); return; }
  if(username.length<3){ toast('Username too short'); return; }
  $('saveProfileBtn').textContent='Saving...';
  const {error}=await supa.from('pingr_users').update({first_name:first, last_name:last, username:username, bio:bio, hide_username:hide}).eq('id',myUser.id);
  $('saveProfileBtn').textContent='Save Profile';
  if(error){ 
    if(error.message.includes('duplicate')||error.message.includes('unique')) toast('Username taken');
    else toast('Failed: '+error.message);
    return;
  }
  myUser.first_name=first; myUser.last_name=last; myUser.username=username; myUser.bio=bio; myUser.hide_username=hide;
  $('settingsName').textContent=first+' '+last;
  $('settingsUsername').textContent='@'+username;
  renderAvatar('myAvatar',myUser,''); renderAvatar('settingsAvatar',myUser,'xl');
  toast('Profile updated');
};
document.querySelectorAll('.nav-tab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active');
    const which=tab.dataset.tab; if(which==='chats'){ $('chatsList').style.display='block'; $('settingsView').style.display='none'; loadChats(); } else { $('chatsList').style.display='none'; $('settingsView').style.display='block'; loadBlocked(); }
  };
});
$('logoutBtn').onclick=()=>{
  showConfirm('Logout?', 'You will be offline.', async()=>{
    const uid=localStorage.getItem('pingr_user_id'); setOnlineStatus(false);
    const token=localStorage.getItem('pingr_session_token');
    if(token) await supa.from('pingr_sessions').delete().eq('token',token);
    localStorage.clear(); location.href='login.html';
  });
};
document.getElementById('picSheet').addEventListener('click', (e)=>{ if(e.target.id==='picSheet') closePop('picSheet'); });
document.getElementById('confirmPopup').addEventListener('click', (e)=>{ if(e.target.id==='confirmPopup') closePop('confirmPopup'); });
document.getElementById('downloadSheet').addEventListener('click', (e)=>{ if(e.target.id==='downloadSheet') closePop('downloadSheet'); });
</script>
</body>
</html>
